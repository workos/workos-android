name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Android SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
      # Pins the JDK that launches Gradle itself. The toolchain in
      # build.gradle.kts only covers compilation; without this the launcher
      # is whatever the runner image defaults to, and Gradle 8.14 cannot
      # start on JDK 25 (the ubuntu-26.04 default).
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          ./gradlew build

  test:
    name: Test Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test
        run: |
          ./gradlew test --info
