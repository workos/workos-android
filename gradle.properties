# NOTE: unlike workos-kotlin, this file IS committed. It carries no credentials —
# signing keys and Maven Central credentials belong in ~/.gradle/gradle.properties,
# the standard Gradle location for user-level secrets.
#
# The heap bump is required, not tuning. Transport.request is a
# `suspend inline fun <reified T>`, so it is inlined at every operation call site
# (261 of them) and each reified instantiation materializes a distinct
# kotlinx.serialization serializer. With the default heap the compiler dies with a
# misleading "Back-end (JVM) Internal error: Couldn't transform method node",
# whose real cause is OutOfMemoryError: GC overhead limit exceeded.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx6g
